name: Build (ECS Fargate image)

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to push (leave empty to use the commit SHA)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'sample-app' }}

jobs:
  # ---------------------------------------------------------------------------
  # Always runs. No AWS credentials, no network calls: this is the gate that
  # proves the image builds and the app answers on every push and pull request.
  # ---------------------------------------------------------------------------
  build:
    name: Build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: app
          push: false
          load: true
          tags: sample-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 8080:8080 \
            -e APP_MESSAGE="Hello from AWS Secrets Manager" \
            -e APP_REGION="us-east-1" \
            sample-app:ci

          cleanup() { docker rm -f smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          echo "waiting for the container to answer /health"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then
              echo "up after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::the container never became healthy"
              docker logs smoke
              exit 1
            fi
            sleep 1
          done

          {
            echo "### Container smoke test"
            echo '```json'
            curl -fsS http://localhost:8080/
            curl -fsS http://localhost:8080/health
            curl -fsS http://localhost:8080/info
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

          # Prove the injected config made it into the process.
          curl -fsS http://localhost:8080/ | grep -q "Hello from AWS Secrets Manager" \
            || { echo "::error::APP_MESSAGE was not picked up by the app"; exit 1; }

      - name: Show container logs
        if: always()
        run: docker logs smoke || true

  # ---------------------------------------------------------------------------
  # Pushes the image to ECR. Requires the Secrets Manager broker, so it is
  # skipped on pull requests and when the repo has not been bootstrapped yet.
  # This job does NOT deploy: it only publishes the artefact.
  # ---------------------------------------------------------------------------
  push:
    name: Push image to ECR
    needs: build
    if: ${{ github.event_name != 'pull_request' && vars.CI_CREDENTIALS_SECRET_ARN != '' }}
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      # The only credential in GitHub. It can read exactly one secret and
      # nothing else. The key it unlocks never appears in GitHub.
      - name: Broker AWS credentials from Secrets Manager
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SM_READER_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SM_READER_SECRET_ACCESS_KEY }}
          CI_CREDENTIALS_SECRET_ARN: ${{ vars.CI_CREDENTIALS_SECRET_ARN }}
        run: bash scripts/broker-aws-credentials.sh

      - name: Resolve AWS account id
        id: aws
        run: echo "account_id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # The ECS service can only reference an image that already exists in
      # ECR, so the repository is created before the image is pushed.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
          terraform_wrapper: true

      - name: Restore Terraform state
        uses: actions/cache/restore@v4
        with:
          path: terraform/terraform.tfstate
          key: tfstate-${{ github.run_id }}
          restore-keys: |
            tfstate-final-
            tfstate-

      - name: Terraform init
        working-directory: terraform
        run: terraform init -input=false

      - name: Ensure the ECR repository exists
        working-directory: terraform
        run: terraform apply -input=false -auto-approve -target=aws_ecr_repository.app

      - name: Docker login to ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin \
              "${{ steps.aws.outputs.account_id }}.dkr.ecr.$AWS_REGION.amazonaws.com"

      - name: Resolve image tag
        id: tag
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_SHA::12}"; fi
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: |
            ${{ steps.aws.outputs.account_id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.image_tag }}
            ${{ steps.aws.outputs.account_id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          TAG: ${{ steps.tag.outputs.image_tag }}
        run: |
          {
            echo "### Image pushed"
            echo ""
            echo '```'
            echo "${{ steps.aws.outputs.account_id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/$ECR_REPOSITORY:$TAG"
            echo '```'
            echo ""
            echo "No deployment was triggered. Publish it manually with:"
            echo ""
            echo '```bash'
            echo "aws ecs update-service --cluster ${{ vars.ECR_REPOSITORY }} --service ${{ vars.ECR_REPOSITORY }} --force-new-deployment"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Last step: the brokered credentials are wiped off the runner.
      - name: Scrub brokered credentials
        if: always()
        run: rm -f ~/.aws/credentials ~/.aws/config
